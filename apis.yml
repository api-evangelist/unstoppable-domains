- aid: unstoppable-domains:unstoppable-domains-hosting-api
  name: Unstoppable Domains hosting API
  description: >-
    Configure how your domains serve content on the web. Hosting configurations control what happens when
    someone visits your domain — whether it redirects to another URL or proxies content from another server.


    Available hosting types:

    - `REDIRECT_301` — Permanent redirect to another URL

    - `REDIRECT_302` — Temporary redirect to another URL

    - `REVERSE_PROXY` — Proxy requests to a backend server


    All hosting configurations require SSL certificate provisioning. When a configuration is created or
    updated, the `certificateStatus` field will be `PENDING` until the certificate is issued and active.
    This process typically completes within a few minutes but may take longer in some cases.
  humanURL: https://docs.unstoppabledomains.com/resolution/overview
  baseURL: https://api.unstoppabledomains.com/resolve
  tags:
  - Hosting
  tags_raw:
  - hosting
