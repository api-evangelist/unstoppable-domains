- aid: unstoppable-domains:unstoppable-domains-external-domains-api
  name: Unstoppable Domains external_domains API
  description: "Manage domains that are owned in external, self-custody wallets.\n\nThe key difference\
    \ between Custody and Self-Custody operations is that all Self-Custody operations require a signature\
    \ from the domain owner.\n\nBefore you can initiate self-custody operations, you must [verify the\
    \ self-custody wallet](/openapi/partner/v3/#tag/external_wallets) that owns the domain.\n\n## Signing\
    \ Self-Custody Operations\nAfter you successfully initiate a self-custody operation, it will have\
    \ a status of `SIGNATURE_REQUIRED`. You then need to collect a signature of the `messageToSign` from\
    \ the `operation.dependencies[].transaction` object. \n\nAfter the owner has signed the message, you\
    \ use the [dependency update route](/openapi/partner/v3/#operation/patchOperationDependency) to submit\
    \ the signature and continue processing the operation."
