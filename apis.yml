- aid: unstoppable-domains:unstoppable-domains-external-wallets-api
  name: Unstoppable Domains external_wallets API
  description: >-
    Manage self-custody wallets to allow for management of self-custody domains.


    ## Verifying Self-Custody Wallets

    Before you can initiate self-custody operations, you must first [verify the self-custody wallet](/openapi/partner/v3/#operation/getExternalWalletVerification)
    (only needs to be done once per wallet).


    This involves:

    1. [Fetching a verification message to sign](/openapi/partner/v3/#operation/getExternalWalletVerification)

    2. Collecting a `personal_sign` signature from the wallet owner

    3. [Submitting the signature](/openapi/partner/v3/#operation/postExternalWalletVerification) to register
    the verified wallet


    After verifying a wallet, it will be returned by the Single-Wallet and Wallet List routes, with the
    type of `EXTERNAL`.


    ## Supported Self-Custody Wallets

    - Externally Owned Accounts (EOAs)

    - [ERC1271](https://eips.ethereum.org/EIPS/eip-1271) Smart Contract wallets deployed on Polygon
  humanURL: https://docs.unstoppabledomains.com/resolution/overview
